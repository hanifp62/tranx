<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 - Halaman tidak ditemukan | tranX</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        --bg: #FAFBFA;
        --surface: #FFFFFF;
        --border: #DEE3E0;
        --text: #141917;
        --text-muted: #4F5855;
        --accent: #17695B;
        --accent-hover: #10574B;
        --on-accent: #FFFFFF;
        --accent-soft: #E0EFEA;
        --shadow: 0 1px 2px rgba(20, 25, 23, 0.06), 0 8px 24px rgba(20, 25, 23, 0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #171B1A;
          --surface: #1F2423;
          --border: #2B3230;
          --text: #E7ECEA;
          --text-muted: #A5AEAA;
          --accent: #5DC3AC;
          --accent-hover: #7FD2BF;
          --on-accent: #0E1A17;
          --accent-soft: #173430;
          --shadow: 0 4px 14px rgba(0, 0, 0, 0.32);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        width: min(440px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 28px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .code-pill {
        align-self: flex-start;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.3;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.6;
        color: var(--text-muted);
      }
      a.home-btn {
        margin-top: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        background: var(--accent);
        color: var(--on-accent);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: background-color 140ms ease, transform 140ms ease;
      }
      a.home-btn:hover {
        background: var(--accent-hover);
      }
      a.home-btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main role="main" aria-labelledby="err-title">
      <span class="code-pill" aria-label="HTTP 404">404</span>
      <h1 id="err-title">Halaman tidak ditemukan</h1>
      <p>
        Alamat yang Anda buka tidak tersedia atau tidak valid di tranX. Silakan kembali ke beranda
        untuk melanjutkan membaca dan menerjemahkan.
      </p>
      <a class="home-btn" href="/">Kembali ke Beranda</a>
    </main>
  </body>
</html>
